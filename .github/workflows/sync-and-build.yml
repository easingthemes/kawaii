name: Sync from Drive & deploy

on:
  # Manual "Publish" from the Apps Script in Google Docs
  repository_dispatch:
    types: [docs-publish]

  # Manual run from the Actions tab
  workflow_dispatch:

  # Nightly safety-net rebuild — catches docs that were published without
  # someone clicking the Publish button (e.g. metadata-only edits).
  schedule:
    - cron: '23 4 * * *'

  # Rebuild on code/config changes
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    name: Pull Google Docs → repo
    runs-on: ubuntu-latest
    # Skip the sync step on direct code pushes — only sync when triggered
    # from Drive, schedule, or manually.
    if: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync Drive → src/content/articles
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
        run: npm run sync:docs

      - name: Commit synced content
        run: |
          git config user.name "kawaii-bot"
          git config user.email "kawaii-bot@users.noreply.github.com"
          git add src/content/articles public/images/articles
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            triggered="${{ github.event.client_payload.triggeredBy || github.actor }}"
            git commit -m "content: sync from Drive (by ${triggered})"
            git push
          fi

  build:
    name: Build & deploy to Pages
    needs: [sync]
    if: ${{ always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Pull the freshly-pushed sync commit
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - id: deploy
        uses: actions/deploy-pages@v4
